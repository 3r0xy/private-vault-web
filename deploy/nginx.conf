# Install inside nginx's http context (e.g. sites-available/luna).
# Replace luna.example.com and certificate paths after issuing your TLS certificate.
limit_req_zone $binary_remote_addr zone=luna_login:10m rate=6r/m;
server {
    listen 80;
    server_name luna.example.com;
    access_log off;
    error_log /dev/null crit;
    return 308 https://luna.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name luna.example.com;
    ssl_certificate /etc/letsencrypt/live/luna.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luna.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Callback contains a one-time OAuth code. Do not log URLs, query strings,
    # cookies, authorization headers or request bodies at this or any upstream proxy.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 10m;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    location = /auth/start {
        limit_req zone=luna_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
    }
}
